blueprint:
  name: Appliance has finished
  description: >
    Version 1.1.0

    Do something when an appliance (like a washing machine or dishwasher)
    has finished as detected by a power sensor.
    Fork of https://gist.github.com/sbyx/6d8344d3575c9865657ac51915684696

    The following variables are available in your action templates:
    - `appliance_entity_id`   – entity_id of the power sensor
    - `appliance_entity_name` – display name of the entity (uses entity_name(), 2026.4+)
    - `appliance_device_name` – name of the parent device (uses device_name(), 2026.4+)
    - `appliance_area_name`   – name of the area the device is assigned to (uses area_name(), 2026.4+)
  domain: automation
  homeassistant:
    min_version: "2026.11.0"
  input:
    power_sensor:
      name: Power Sensor
      description: Power sensor entity (e.g. from a smart plug device).
      selector:
        entity:
          domain: sensor
    starting_threshold:
      name: Starting power threshold
      description: Power threshold above which we assume the appliance has started.
      default: 5
      selector:
        number:
          min: 1.0
          max: 100.0
          unit_of_measurement: W
          mode: slider
          step: 1.0
    starting_hysteresis:
      name: Starting hysteresis
      description: Time duration the power measurement has to stay above the starting
        power threshold.
      default: 5
      selector:
        number:
          min: 0.25
          max: 60.0
          unit_of_measurement: min
          mode: slider
          step: 0.25
    finishing_threshold:
      name: Finishing power threshold
      description: Power threshold below which we assume the appliance has finished.
      default: 5
      selector:
        number:
          min: 1.0
          max: 100.0
          unit_of_measurement: W
          mode: slider
          step: 1.0
    finishing_hysteresis:
      name: Finishing hysteresis
      description: Time duration the power measurement has to stay below the finishing
        power threshold.
      default: 5
      selector:
        number:
          min: 0.25
          max: 60.0
          unit_of_measurement: min
          mode: slider
          step: 0.25
    pre_actions:
      name: Actions when starting
      description: >
        Actions executed when the starting threshold is crossed.
        Use variables: appliance_entity_id, appliance_entity_name,
        appliance_device_name, appliance_area_name.
      default: []
      selector:
        action: {}
    actions:
      name: Actions when finished
      description: >
        Actions executed when the appliance has finished (e.g. push a
        notification, TTS announcement).
        Use variables: appliance_entity_id, appliance_entity_name,
        appliance_device_name, appliance_area_name.
      selector:
        action: {}
  source_url: https://github.com/FlySmack/hass-appliance-finished.git

variables:
  _power_sensor: !input power_sensor
  appliance_entity_id: "{{ _power_sensor }}"
  appliance_entity_name: "{{ entity_name(_power_sensor) }}"
  appliance_device_name: "{{ device_name(_power_sensor) }}"
  appliance_area_name: "{{ area_name(_power_sensor) }}"

triggers:
  - trigger: numeric_state
    entity_id: !input power_sensor
    for:
      minutes: !input starting_hysteresis
    above: !input starting_threshold

conditions: []

actions:
  - choose: []
    default: !input pre_actions
  - wait_for_trigger:
      - trigger: numeric_state
        entity_id: !input power_sensor
        below: !input finishing_threshold
        for:
          minutes: !input finishing_hysteresis
  - choose: []
    default: !input actions

mode: single
max_exceeded: silent
